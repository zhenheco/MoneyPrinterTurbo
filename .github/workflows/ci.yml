name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test

      - name: Run unit tests with coverage
        # pytest 兼容现有 unittest.TestCase，同时会收集仓库中的 pytest 风格
        # 测试，避免测试文件已存在但 CI 没有真正执行。
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py

      # The job pipeline writes and reads a directory tree per job, so it is the
      # part of this repository most exposed to Windows path semantics —
      # separators, path containment checks, and reserved characters in ids.
      # These tests are filesystem + pydantic work with no Redis and no
      # network, so they are cheap to run here and this is the only job that
      # would ever catch a POSIX-only assumption in them.
      #
      # Add every new job pipeline test file to this list — it is enumerated,
      # so a file left off simply never runs on Windows. The master voice tests
      # touch ffmpeg through the duration probe, but they self-gate: the ones
      # that need a decoder skip without it, and imageio-ffmpeg ships a
      # bundled binary in its wheel, so they are safe here either way.
      - name: Run job pipeline tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_content_job_models.py
          test/services/test_job_store.py
          test/services/test_job_state_machine.py
          test/services/test_job_budget.py
          test/services/test_job_pipeline.py
          test/services/test_job_scene_planner.py
          test/services/test_job_postiz.py
          test/services/test_job_master_voice.py
